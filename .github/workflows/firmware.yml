# Compile le firmware pour chaque carte declaree, sur le runner de l'organisation.
#
# Pourquoi les runners de GitHub et pas le notre : ce depot est PUBLIC, donc
# n'importe qui peut ouvrir une PR. Sur notre runner d'organisation, ce code
# s'executerait a cote de nos depots prives, avec le socket docker et un reseau
# qui joint Proxmox et le VLAN des automates. Mesure le 2026-10-02. Les runners
# de GitHub sont gratuits et illimites sur un depot public, et jetables : le
# prix a payer est de tirer l'image ESP-IDF a chaque execution.
#
# Les cartes ne sont pas listees ici : elles viennent de boards/*.json, seul
# endroit ou une carte se declare. Ajouter une carte, c'est ajouter un fichier.
name: Firmware

# Une seule execution par branche : sans cela, une branche qui a une PR ouverte
# compile deux fois, une fois pour le push et une fois pour la PR, et les deux
# se disputent l'unique runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  # Toutes les branches, pas seulement main : une branche de travail doit etre
  # compilee avant d'etre fusionnee, pas apres. Pas de liste a tenir a jour.
  push:
  workflow_dispatch:

# `pipefail` pour tout le travail : sans lui, un `docker run ... | tee` rend le
# code de sortie de `tee`, donc TOUJOURS 0, et une compilation en echec passe au
# vert. Le piege a deja coute une qualification verte sur du code casse le
# 2026-09-12 (voir isno-launcher/.github/workflows/qualifier.yml).
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  cartes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrice: ${{ steps.lire.outputs.matrice }}
    steps:
      - uses: actions/checkout@v7
      - id: lire
        name: Lire les cartes declarees dans boards/
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, glob, os
          cartes = []
          for f in sorted(glob.glob('boards/*.json')):
              nom = os.path.basename(f)[:-5]
              mcu = json.load(open(f)).get('mcu')
              if not mcu:
                  raise SystemExit(f"{f} ne declare pas de mcu")
              cartes.append({"board": nom, "target": mcu})
          print("matrice=" + json.dumps(cartes))
          PY
      - name: Resume
        run: echo '${{ steps.lire.outputs.matrice }}'
      # Une route de trop n'est pas enregistree (404) : /api/central dehors depuis #42, en v0.2.12.
      - name: Places des tables de routes (web_ui.c)
        run: python3 tools/check_routes.py

  build:
    needs: cartes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        carte: ${{ fromJSON(needs.cartes.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v7

      - name: Compiler ${{ matrix.carte.board }} (${{ matrix.carte.target }})
        run: |
          # Un repertoire de build par carte : deux cibles differentes ne peuvent
          # pas partager le meme cache CMake.
          #
          # -u : le conteneur ecrit sous l'utilisateur du runner. Sans cela tout
          # sort en root, et le job SUIVANT ne peut plus nettoyer le repertoire.
          # Mesure le 2026-10-02 : 260 fichiers root sans l'option, 216 fichiers
          # au bon proprietaire avec. HOME=/tmp car l'utilisateur du runner n'a
          # pas de foyer dans l'image.
          docker run --rm --name "opf-${{ matrix.carte.board }}-$GITHUB_RUN_ID" \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/project -w /project/firmware \
            "$IDF_IMAGE" bash -c "
              set -e
              idf.py -B build-ci set-target ${{ matrix.carte.target }}
              idf.py -B build-ci -DBOARD=${{ matrix.carte.board }} build
            "

      - name: Versions des composants figees
        run: |
          # Le build doit avoir pris firmware/dependencies.lock.<puce> tel qu'il est commis.
          # S'il l'a cree (puce nouvelle) ou recalcule (idf_component.yml modifie), les
          # versions ne sont plus figees : commettre le fichier produit, ci-dessous.
          lock="firmware/dependencies.lock.${{ matrix.carte.target }}"
          if [ -n "$(git status --porcelain -- "$lock")" ]; then
            echo "::error title=${{ matrix.carte.board }}::$lock cree ou recalcule par le build : le commettre"
            git diff -- "$lock" || true
            cat "$lock"
            exit 1
          fi

      - name: Taille de l'image
        run: |
          bin=$(ls firmware/build-ci/*.bin | grep -vE 'bootloader|partition' | head -1)
          echo "::notice title=${{ matrix.carte.board }}::$(basename "$bin") = $(stat -c%s "$bin") octets"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.carte.board }}
          path: |
            firmware/build-ci/*.bin
            firmware/build-ci/*.map
          retention-days: 14

  # La persistance de la config (cfg_model.c + cfg_store.c) sur la vraie
  # bibliotheque NVS, partition de 16 Ko emulee, coupures de courant simulees :
  # voir firmware/test/cfg_store/README.md. Une seconde d'execution une fois
  # compile, et le programme rend 1 au premier echec.
  banc:
    name: Banc de test de la persistance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: cfg_model + cfg_store sur une NVS emulee (cible linux)
        run: |
          # Memes options que la compilation des cartes : -u pour ne rien
          # laisser en root, HOME=/tmp car l'utilisateur du runner n'a pas de
          # foyer dans l'image.
          docker run --rm --name "opf-banc-$GITHUB_RUN_ID" \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/project -w /project/firmware/test/cfg_store \
            "$IDF_IMAGE" bash -c "
              set -e
              idf.py --preview set-target linux
              idf.py build
              ./build/cfg_store_host_test.elf
            "

  # Le decodeur OOK HCS30x/KeeLoq (keeloq_decode.c) sur des trames en bouchon :
  # voir firmware/test/keeloq/README.md. Il est PUR, donc un simple gcc suffit,
  # sans l'image IDF : quelques secondes, et il rend 1 au premier echec.
  banc-keeloq:
    name: Banc de test du decodeur KeeLoq
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: keeloq_decode sur trames en bouchon (gcc + AddressSanitizer)
        working-directory: firmware/test/keeloq
        run: |
          cc -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fsanitize=address -g \
             -I main -I ../../main main/test_main.c ../../main/keeloq_decode.c \
             -o keeloq_host_test
          ./keeloq_host_test

  # Le balayage RSSI qui trouve la porteuse d'une telecommande (freq_sweep.c) :
  # voir firmware/test/freq-sweep/README.md. Pur, un simple gcc suffit (issue #51).
  banc-freq-sweep:
    name: Banc de test du balayage RSSI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: freq_sweep sur courbes synthetiques (gcc + AddressSanitizer)
        working-directory: firmware/test/freq-sweep
        run: |
          cc -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fsanitize=address -g \
             -I main -I ../../main main/test_main.c ../../main/freq_sweep.c \
             -o freq_sweep_host_test
          ./freq_sweep_host_test

  # La porte d'apprentissage de l'enrolement (enrol_gate.c) : pas d'apprentissage sans
  # capture reussie dans la tentative en cours. Voir firmware/test/enrol-gate (issue #53).
  banc-enrol-gate:
    name: Banc de test de la porte d'apprentissage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: enrol_gate (gcc + AddressSanitizer)
        working-directory: firmware/test/enrol-gate
        run: |
          cc -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fsanitize=address -g \
             -I main -I ../../main main/test_main.c ../../main/enrol_gate.c \
             -o enrol_gate_host_test
          ./enrol_gate_host_test

  # Le retour automatique apres une mise a jour (ota_rollback.c) : ce que le firmware conclut
  # des etats OTA. Voir firmware/test/ota-rollback. Pur, un simple gcc suffit.
  banc-ota-rollback:
    name: Banc de test du retour automatique
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: ota_rollback (gcc + AddressSanitizer)
        working-directory: firmware/test/ota-rollback
        run: |
          cc -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fsanitize=address -g \
             -I main -I ../../main main/test_main.c ../../main/ota_rollback.c \
             -o ota_rollback_host_test
          ./ota_rollback_host_test

  # Le nom mDNS du boitier (mdns_name.c) : nettoyage du nom choisi, nom par defaut a suffixe
  # pour un boitier neuf. Voir firmware/test/mdns-name.
  banc-mdns-name:
    name: Banc de test du nom mDNS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: mdns_name (gcc + AddressSanitizer)
        working-directory: firmware/test/mdns-name
        run: |
          cc -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fsanitize=address -g \
             -I main -I ../../main main/test_main.c ../../main/mdns_name.c \
             -o mdns_name_host_test
          ./mdns_name_host_test

  # Les envois venus de la page d'un autre site (req_guard.c) : refuses, sans toucher a
  # l'interface, a Home Assistant ni aux scripts. Voir firmware/test/req-guard.
  banc-req-guard:
    name: Banc de test des envois venus d'un autre site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: req_guard (gcc + AddressSanitizer)
        working-directory: firmware/test/req-guard
        run: |
          cc -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fsanitize=address -g \
             -I main -I ../../main main/test_main.c ../../main/req_guard.c \
             -o req_guard_host_test
          ./req_guard_host_test

  # La confirmation d'une trame recue par une seconde identique (rx_confirm.c) :
  # voir firmware/test/rx-confirm/README.md. Pure, un simple gcc suffit (issue #39).
  banc-rx-confirm:
    name: Banc de test de la confirmation des trames
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: rx_confirm sur trames en bouchon (gcc + AddressSanitizer)
        working-directory: firmware/test/rx-confirm
        run: |
          cc -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fsanitize=address -g \
             -I main -I ../../main main/test_main.c ../../main/rx_confirm.c \
             -o rx_confirm_host_test
          ./rx_confirm_host_test

  # La politique TLS mqtts (mqtt_tls_policy.c) : quand lever le controle du nom (CN) du
  # certificat du broker. Pure, un simple gcc suffit. Issu de la revue codex sur #11 (P1).
  banc-mqtt-tls:
    name: Banc de test de la politique TLS mqtts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: politique TLS sur URI en bouchon (gcc + AddressSanitizer)
        working-directory: firmware/test/mqtt-tls
        run: |
          cc -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fsanitize=address -g \
             -I main -I ../../main main/test_main.c ../../main/mqtt_tls_policy.c \
             -o mqtt_tls_host_test
          ./mqtt_tls_host_test

  # Les profils radio (radio_profile.c) : frequence par marque, plage autorisee, mot de
  # frequence CC1101. Pur, un simple gcc suffit.
  banc-radio-profile:
    name: Banc de test des profils radio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: profils et mots de frequence (gcc + AddressSanitizer)
        working-directory: firmware/test/radio-profile
        run: |
          cc -std=gnu11 -Wall -Wextra -Wno-unused-parameter -fsanitize=address -g \
             -I main -I ../../main main/test_main.c ../../main/radio_profile.c \
             -o radio_profile_host_test
          ./radio_profile_host_test

env:
  # Version epinglee : une montee d'IDF se decide, elle ne se subit pas au
  # prochain build. Le depot compile sur v6.1 depuis la migration du 27/09.
  IDF_IMAGE: espressif/idf:v6.1
