## Dépendances gérées (ESP-IDF Component Manager)
dependencies:
  idf: ">=5.2"
  espressif/mdns: "^1.2.0"
  espressif/mqtt: ">=1.0.0"
  espressif/cjson: "^1.7.19"
  # PHY Ethernet LAN8720, sorti d'ESP-IDF v6.1 vers le registre. Utilise seulement par
  # la variante esp32-poe (garde BOARD_HAS_ETHERNET). Conditionne a la cible esp32 : le
  # composant n'existe pas pour esp32s3 (pas d'EMAC Ethernet), sinon le build S3 echoue.
  espressif/lan87xx:
    version: "*"
    rules:
      - if: "target == esp32"
