services:
  esp-idf:
    build:
      context: .
      dockerfile: Dockerfile.esp-idf
    container_name: openprofalux-esp-idf
    volumes:
      - ./firmware:/project/firmware
      - ./docs:/project/docs
      - ./README.md:/project/README.md
    # Port serie : decommenter pour flasher, et ajuster. Laisse actif, docker
    # compose refuse de demarrer sur une machine qui n'a pas ce peripherique.
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    working_dir: /project/firmware
    # Pas d'IDF_TARGET ici : la cible depend de la carte choisie au build
    # (-DBOARD=...), et figer esp32 ferait echouer isno-super en silence.
    stdin_open: true
    tty: true
    command: bash
