services:
  esp-idf:
    build:
      context: .
      dockerfile: Dockerfile.esp-idf
    # Reconstruire a chaque lancement (quelques secondes en cache) : sans cela, compose garde
    # l'image deja construite, meme quand Dockerfile.esp-idf change de version d'ESP-IDF.
    pull_policy: build
    container_name: openprofalux-esp-idf
    # Tout le depot : le CMake du firmware lit boards/<carte>.json et tools/ a la racine.
    volumes:
      - .:/project
    # Port serie : decommenter pour flasher, et ajuster. Laisse actif, docker
    # compose refuse de demarrer sur une machine qui n'a pas ce peripherique.
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    working_dir: /project/firmware
    # Pas d'IDF_TARGET ici : la cible depend de la carte choisie au build
    # (-DBOARD=...), et figer esp32 ferait echouer isno-super en silence.
    stdin_open: true
    tty: true
    command: bash
